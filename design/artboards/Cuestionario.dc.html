<helmet>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..600&display=swap');

  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; background: #F2F0EC; color: #0C1520;
         -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  a { color: #007A65; text-decoration: none; }
  a:hover { color: #009A80; text-decoration: underline; }
  p { margin: 0; }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; }

  /* Rúbrica: la etiqueta condensada en versalitas que ordena cada bloque.
     Es el gesto que ya existía en el sidebar (10px / 0.22em) elevado a
     principio de todo el sistema. */
  .rub { font-family: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; font-size: 10px; font-weight: 600;
         letter-spacing: 0.22em; text-transform: uppercase; color: #8A9FAE; }
  .rub-ink { color: #4A5F70; }

  /* Titular editorial: Barlow Semi Condensed en tamaños de revista. */
  .display { font-family: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; font-weight: 600; letter-spacing: -0.02em;
             line-height: 0.94; color: #0C1520; }

  /* Todo dato es monoespaciado: puntaje, conteo, fecha, token, hash. */
  .num { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }

  /* Narrativa clínica: la interpretación se lee como texto, no como UI. */
  .prose { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; font-size: 16.5px; line-height: 1.62;
           color: #1D2B38; text-wrap: pretty; }

  /* ── Chrome de aplicación ─────────────────────────────────────────── */
  .shell { display: flex; height: 100%; background: #F2F0EC; }
  .side { width: 240px; flex-shrink: 0; background: #FFFFFF;
          border-right: 1px solid #D4CFC8; display: flex; flex-direction: column; }
  .side-brand { padding: 26px 24px 22px; }
  .side-nav { flex: 1; padding: 0 12px; display: flex; flex-direction: column; gap: 22px; }
  .side-group { display: flex; flex-direction: column; gap: 1px; }
  .side-group > .rub { padding: 0 12px; margin-bottom: 7px; }
  .nav { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 12px;
         font-size: 13px; color: #4A5F70; border-left: 2px solid transparent;
         border-radius: 6px; }
  .nav-on { color: #009A80; font-weight: 600; background: #CCF0E8;
            border-left-color: #009A80; }
  .side-foot { padding: 14px 16px; border-top: 1px solid #D4CFC8;
               display: flex; align-items: center; gap: 10px; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 52px; flex-shrink: 0; background: #FFFFFF;
         border-bottom: 1px solid #D4CFC8; display: flex; align-items: center;
         justify-content: space-between; padding: 0 28px; }
  .kbd { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; padding: 2px 6px; border-radius: 4px;
         background: #E8E5E0; color: #8A9FAE; }
  .body { flex: 1; padding: 34px 40px 44px; overflow: hidden; }

  /* ── Primitivas ───────────────────────────────────────────────────── */
  .card { background: #FFFFFF; border: 1px solid #D4CFC8; border-radius: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 16px;
         border-radius: 8px; font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; }
  .btn-pri { background: #009A80; color: #FFF; }
  .btn-sec { background: #FFFFFF; color: #0C1520; border: 1px solid #D4CFC8; }
  .btn-ghost { color: #4A5F70; }
  .input { height: 40px; border: 1px solid #D4CFC8; border-radius: 8px;
           background: #FFFFFF; padding: 0 13px; font-size: 14px; color: #8A9FAE;
           display: flex; align-items: center; }
  .lbl { font-size: 11.5px; font-weight: 600; letter-spacing: 0.11em;
         text-transform: uppercase; color: #8A9FAE; }
  .th { font-family: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.18em;
        text-transform: uppercase; color: #8A9FAE; text-align: left;
        padding: 0 0 10px; border-bottom: 1px solid #D4CFC8; }
  .td { padding: 13px 0; border-bottom: 1px solid #E2DED8; font-size: 13.5px;
        color: #0C1520; vertical-align: middle; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px;
          border-radius: 999px; font-size: 11.5px; font-weight: 600; }
</style>
